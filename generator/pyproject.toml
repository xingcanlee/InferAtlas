[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inferatlas"
version = "0.1.0"
description = "Deterministic source-linked inference architecture contracts and generator"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2,<3",
  "typer>=0.12,<1",
  "ruamel.yaml>=0.18,<1",
  "lark>=1.2,<2",
  "packaging>=24",
  "httpx>=0.27,<1",
  "rich>=13,<15",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "jsonschema>=4.23,<5",
]

[project.scripts]
inferatlas = "inferatlas.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["inferatlas"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
