name: Build snapshots
on:
  # Let GitHub register workflow edits without executing the pipeline.
  push:
    branches-ignore: [state, gh-pages]
    paths: [.github/workflows/build.yml]
  workflow_dispatch:
    inputs:
      vllm_commit:
        description: Full vLLM commit SHA
        required: true
        type: string
      ascend_commit:
        description: Full vllm-ascend commit SHA
        required: true
        type: string
      vllm_tag:
        description: Display label for vLLM
        default: pinned
        type: string
      ascend_tag:
        description: Display label for vllm-ascend
        default: pinned
        type: string
      publish:
        description: Publish clean snapshots (default branch only)
        default: true
        type: boolean
  workflow_call:
    inputs:
      vllm_commit:
        required: true
        type: string
      ascend_commit:
        required: true
        type: string
      vllm_tag:
        default: pinned
        type: string
      ascend_tag:
        default: pinned
        type: string
      publish:
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: snapshots-${{ inputs.vllm_commit }}-${{ inputs.ascend_commit }}-${{ github.sha }}-${{ inputs.publish }}
  cancel-in-progress: false
env:
  UV_INDEX_URL: https://pypi.org/simple/
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  VLLM_TARGET_DEVICE: cpu
  VLLM_USE_V1: '1'
jobs:
  plan:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      snapshot: ${{ steps.plan.outputs.snapshot }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Validate pins and expand catalog
        id: plan
        env:
          INFERATLAS_VLLM_COMMIT: ${{ inputs.vllm_commit }}
          INFERATLAS_ASCEND_COMMIT: ${{ inputs.ascend_commit }}
          INFERATLAS_VLLM_TAG: ${{ inputs.vllm_tag }}
          INFERATLAS_ASCEND_TAG: ${{ inputs.ascend_tag }}
        run: uv run --project generator python .github/actions/pipeline.py plan
  extract:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      INFERATLAS_SRC: ${{ github.workspace }}/.cache/upstream
      INFERATLAS_PY: ${{ github.workspace }}/.cache/extract-venv/bin/python
      INFERATLAS_VLLM_COMMIT: ${{ inputs.vllm_commit }}
      INFERATLAS_ASCEND_COMMIT: ${{ inputs.ascend_commit }}
      INFERATLAS_VLLM_TAG: ${{ inputs.vllm_tag }}
      INFERATLAS_ASCEND_TAG: ${{ inputs.ascend_tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: vllm-project/vllm
          ref: ${{ inputs.vllm_commit }}
          path: .cache/upstream/vllm
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: vllm-project/vllm-ascend
          ref: ${{ inputs.ascend_commit }}
          path: .cache/upstream/vllm-ascend
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build expression and layout packages
        run: pnpm --filter '@inferatlas/*' -r build
      - uses: ./.github/actions/cpu-extract
      - name: Build and gate this model and device
        env:
          CELL: ${{ toJSON(matrix) }}
        run: uv run --project generator python .github/actions/pipeline.py cell
      - name: Keep results and diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cell-${{ matrix.id }}-${{ matrix.device }}
          path: .cache/cell/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
  collect:
    needs: [plan, extract]
    if: ${{ !cancelled() && github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    outputs:
      clean: ${{ steps.collect.outputs.clean }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: cell-*
          path: .cache/cells
      - name: Separate publishable cells from triage
        id: collect
        env:
          EXPECTED_MATRIX: ${{ needs.plan.outputs.matrix }}
        run: uv run --project generator python .github/actions/pipeline.py collect
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bundle
          path: .cache/bundle/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Request a maintenance draft
        if: ${{ steps.collect.outputs.triage == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh workflow run draft-pr.yml --ref "$DEFAULT_BRANCH" \
            -f "run_id=$GITHUB_RUN_ID"
      - name: Reject missing or failed cells
        env:
          ERROR_COUNT: ${{ steps.collect.outputs.errors }}
        run: test "$ERROR_COUNT" = 0
  publish:
    needs: [plan, extract, collect]
    if: ${{ !cancelled() && needs.extract.result == 'success' && needs.collect.result == 'success' && inputs.publish && vars.INFERATLAS_PAGES_DEPLOY == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: inferatlas-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: bundle
          path: .cache/bundle
      - name: Restore retained snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          uv run --project generator python .github/actions/pipeline.py restore
      - name: Render the retained catalog and single files
        if: needs.collect.outputs.clean != '0'
        env:
          SNAPSHOT_ID: ${{ needs.plan.outputs.snapshot }}
        run: uv run --project generator python .github/actions/pipeline.py render
      - name: Publish or verify the immutable HTML release
        if: needs.collect.outputs.clean != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_ID: ${{ needs.plan.outputs.snapshot }}
        run: uv run --project generator python .github/actions/pipeline.py release_snapshot
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        if: needs.collect.outputs.clean != '0'
        with:
          path: dist/site
      - name: Deploy Pages
        if: needs.collect.outputs.clean != '0'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Record the handled pair after publication
        env:
          GH_TOKEN: ${{ github.token }}
          INFERATLAS_VLLM_COMMIT: ${{ inputs.vllm_commit }}
          INFERATLAS_ASCEND_COMMIT: ${{ inputs.ascend_commit }}
          SNAPSHOT_ID: ${{ needs.plan.outputs.snapshot }}
        run: uv run --project generator python .github/actions/pipeline.py publish
  record-failure:
    needs: [plan, extract, collect, publish]
    if: ${{ always() && !cancelled() && inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (needs.plan.result == 'failure' || needs.extract.result == 'failure' || needs.collect.result == 'failure' || needs.publish.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: inferatlas-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Record hard failure at this generator revision
        env:
          GH_TOKEN: ${{ github.token }}
          INFERATLAS_VLLM_COMMIT: ${{ inputs.vllm_commit }}
          INFERATLAS_ASCEND_COMMIT: ${{ inputs.ascend_commit }}
        run: |
          gh auth setup-git
          uv run --project generator python .github/actions/pipeline.py record_failure
