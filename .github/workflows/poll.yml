name: Poll upstream releases
on:
  # Let GitHub register workflow edits without executing the pipeline.
  push:
    branches-ignore: [state, gh-pages]
    paths: [.github/workflows/poll.yml]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: inferatlas-poll
  cancel-in-progress: false
jobs:
  poll:
    if: github.event_name != 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name != 'schedule' || vars.INFERATLAS_AUTOMATION == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { poll } = require('./.github/actions/upstream.cjs');
            await poll({ github, context, core });
