name: Poll upstream releases
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: inferatlas-poll
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            const { poll } = require('./.github/actions/upstream.cjs');
            await poll({ github, context, core });
