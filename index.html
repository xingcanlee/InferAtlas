<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>InferAtlas</title>
    <script>
      // Apply the persisted theme before first paint (no flash).
      let theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      try {
        const saved = JSON.parse(localStorage.getItem("inferatlas-ui") || "{}").state;
        if (saved?.theme) theme = saved.theme;
      } catch {}
      document.documentElement.classList.toggle("dark", theme === "dark");
    </script>
    <script type="module" crossorigin src="./assets/index-JEZpk3fU.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Cucbwyvd.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
