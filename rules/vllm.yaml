          - T
          - H
        dtype: dtype_a
    weight: round_up(V,64)/tp*H*bytes(dtype_w)
    flops:
      prefill: '0'
      decode: '0'
    bytes_moved:
      prefill: T*H*(bytes(dtype_w)+bytes(dtype_a))
      decode: S*H*(bytes(dtype_w)+bytes(dtype_a))
    shard:
      tp: vocab
    emits:
      - suffix: reduce
        kind: comm
        comm:
          op: all_reduce
          group: tp
          logical_bytes:
            prefill: T*H*bytes(dtype_a)
            decode: S*H*bytes(dtype_a)
          bus_bytes:
            prefill: 'tp>1 ? (2*(tp-1)/tp)*(T*H*bytes(dtype_a)) : 0'
            decode: 'tp>1 ? (2*(tp-1)/tp)*(S*H*bytes(dtype_a)) : 0'
          when: tp>1
          notes:
            - Ring estimate; logical bytes describe the tensor even when inactive.
