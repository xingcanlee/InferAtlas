      - name: output
        shape:
          - T
          - 'gather_output ? out_features : out_features/tp'
        dtype: dtype_a
    weight: '(in_features*out_features/tp*bytes(dtype_w))+(has_bias ? (out_features/tp)*bytes(dtype_w) : 0)'
    flops:
      prefill: 2*T*in_features*out_features/tp
      decode: 2*S*in_features*out_features/tp
    bytes_moved:
      prefill: '((in_features*out_features/tp*bytes(dtype_w))+(has_bias ? (out_features/tp)*bytes(dtype_w) : 0))+T*((in_features)+(out_features/tp))*bytes(dtype_a)'
      decode: '((in_features*out_features/tp*bytes(dtype_w))+(has_bias ? (out_features/tp)*bytes(dtype_w) : 0))+S*((in_features)+(out_features/tp))*bytes(dtype_a)'
    shard:
      tp: out
    emits:
