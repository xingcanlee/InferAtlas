  - id: moe.method
    match:
      class: UnquantizedFusedMoEMethod
      vllm: '>=0.32,<0.33'
    context: []
    out:
      - name: output
        shape:
          - T
          - H
        dtype: dtype_a
    weight: '0'
    flops:
      prefill: '0'
      decode: '0'
    bytes_moved:
      prefill: '0'
      decode: '0'
    shard: {}
    emits: []
    notes: []
  - id: moe.runner
    match:
      class: MoERunner
      vllm: '>=0.32,<0.33'
    context: []
    out:
      - name: output
        shape:
          - T
          - H
        dtype: dtype_a
    weight: '0'
    flops:
      prefill: '0'
      decode: '0'
    bytes_moved:
      prefill: '0'
      decode: '0'
    shard: {}
    emits:
      - *id001
      - *id002
      - *id003
    notes:
      - Default unfused final reduction, skip_final_all_reduce=false, PCP=SP=1.
  - id: moe.weights
    match:
      class: RoutedExperts
      vllm: '>=0.32,<0.33'
    context:
      - num_experts
      - intermediate_size
      - top_k
    out:
      - name: output
        shape:
          - T
          - H
        dtype: dtype_a
    weight: '3*(ep>1 ? num_experts/ep : num_experts)*H*intermediate_size/(ep>1 ? 1 : tp*dp)*bytes(dtype_w)'
    flops:
      prefill: '6*T*dp*top_k*H*intermediate_size/(ep>1 ? ep : tp*dp)+4*T*dp*top_k*intermediate_size/(ep>1 ? ep :
        tp*dp)'
      decode: '6*S*dp*top_k*H*intermediate_size/(ep>1 ? ep : tp*dp)+4*S*dp*top_k*intermediate_size/(ep>1 ? ep :
        tp*dp)'
    bytes_moved:
      prefill: '3*min(num_experts/(ep>1 ? ep : 1),T*dp*top_k/(ep>1 ? ep : 1))*H*intermediate_size/(ep>1 ? 1 : tp*dp)*bytes(dtype_w)+T*dp*top_k/(ep>1
        ? ep : 1)*(2*H+6*intermediate_size/(ep>1 ? 1 : tp*dp))*bytes(dtype_a)'
      decode: '3*min(num_experts/(ep>1 ? ep : 1),S*dp*top_k/(ep>1 ? ep : 1))*H*intermediate_size/(ep>1 ? 1 : tp*dp)*bytes(dtype_w)+S*dp*top_k/(ep>1
        ? ep : 1)*(2*H+6*intermediate_size/(ep>1 ? 1 : tp*dp))*bytes(dtype_a)'
    shard:
      tp: intermediate
      ep: experts
    emits: []
    notes:
      - Without EP intermediate TP is flattened over tp*dp. With EP whole experts shard over ep. FLOPs assume
        uniform routed-token ownership.
    parameter_shapes:
      w13_weight:
        - '(ep>1 ? num_experts/ep : num_experts)'
        - '2*intermediate_size/(ep>1 ? 1 : tp*dp)'
        - H
      w2_weight:
        - '(ep>1 ? num_experts/ep : num_experts)'
        - H
        - 'intermediate_size/(ep>1 ? 1 : tp*dp)'
  - id: norm.rms
    match:
      class: RMSNorm
      vllm: '>=0.32,<0.33'
    context:
      - norm_size
      - norm_copies
    out:
      - name: output
        shape:
          - T
          - norm_size*norm_copies
        dtype: dtype_a
    weight: norm_size*bytes(dtype_w)
    flops:
      prefill: 5*T*norm_size*norm_copies
      decode: 5*S*norm_size*norm_copies
    bytes_moved:
      prefill: norm_size*bytes(dtype_w)+2*T*norm_size*norm_copies*bytes(dtype_a)
      decode: norm_size*bytes(dtype_w)+2*S*norm_size*norm_copies*bytes(dtype_a)
    shard:
      tp: replicated
    emits: []
    notes: []
    parameter_shapes:
      weight:
        - norm_size
  - id: rotary
    match:
      class: RotaryEmbedding
      vllm: '>=0.32,<0.33'
    context: []
    out:
      - name: q
        shape:
          - T
          - Hq/tp
          - D
        dtype: dtype_a
      - name: k
        shape:
          - T
          - max(1,Hkv/tp)
          - D
        dtype: dtype_a
    weight: '0'
    flops:
      prefill: '0'
      decode: '0'
    bytes_moved:
      prefill: '0'
      decode: '0'
    shard: {}
    emits: []
    notes:
      - RoPE buffers are excluded from parameter weights. Arithmetic is on ApplyRotaryEmb.
  - id: rotary.apply
    match:
      class: ApplyRotaryEmb
      vllm: '>=0.32,<0.33'
    context: []
    out:
      - name: q
        shape:
          - T
          - Hq/tp
          - D
        dtype: dtype_a
      - name: k
        shape:
          - T
          - max(1,Hkv/tp)
          - D
        dtype: dtype_a
    weight: '0'
    flops:
      prefill: 3*T*(Hq/tp+max(1,Hkv/tp))*D
      decode: 3*S*(Hq/tp+max(1,Hkv/tp))*D
    bytes_moved:
      prefill: 2*T*(Hq/tp+max(1,Hkv/tp))*D*bytes(dtype_a)
      decode: 2*S*(Hq/tp+max(1,Hkv/tp))*D*bytes(dtype_a)
    shard: {}
    emits: []
    notes: []
  - id: sampler
    match:
      class: Sampler
      vllm: '>=0.32,<0.33'
    context: []
    out:
      - name: output
        shape:
          prefill:
            - batch
          decode:
            - S
        dtype: dtype_ids
    weight: '0'
    flops:
      prefill: batch*V
      decode: S*V
    bytes_moved:
      prefill: 2*batch*V*bytes(fp32)
      decode: 2*S*V*bytes(fp32)
    shard: {}
    emits: []
    notes:
      - Activation peak models logits, fp32 copy/probabilities/sort values, and int64 indices; backend scratch
        excluded.
