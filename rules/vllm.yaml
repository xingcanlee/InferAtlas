            decode: S*round_up(V,64)/tp*bytes(dtype_a)
          bus_bytes:
            prefill: 'tp>1 ? ((tp-1)/tp)*(batch*round_up(V,64)/tp*bytes(dtype_a)) : 0'
            decode: 'tp>1 ? ((tp-1)/tp)*(S*round_up(V,64)/tp*bytes(dtype_a)) : 0'
          when: tp>1
          notes:
            - Ring estimate; logical bytes describe the tensor even when inactive.
    notes:
      - 'Default gather to TP rank zero: bus bytes are rank-average outgoing local-shard bytes. Full-result all_gather
        uses a different convention.'
  - id: moe.fused
    match:
      class: FusedMoE
      vllm: '>=0.32,<0.33'
    inherits: moe.weights
    emits:
      - &id001
        suffix: dispatch
        kind: comm
        comm:
          op: all_gather
          group: ep
          logical_bytes:
            prefill: T*H*bytes(dtype_a)
            decode: S*H*bytes(dtype_a)
          bus_bytes:
            prefill: 'dp>1 ? (tp*dp-1)/(tp*dp)*(T*H*bytes(dtype_a)) : 0'
            decode: 'dp>1 ? (tp*dp-1)/(tp*dp)*(S*H*bytes(dtype_a)) : 0'
          when: dp>1
          notes:
            - Default allgather_reducescatter backend, flattened tp*dp group even with ep=1. Logical tensor is
              T*H; ring bus factor is (n-1)/n. Expert compute uses T*dp gathered tokens. Router
              scores/metadata omitted.
      - &id002
        suffix: combine
        kind: comm
        comm:
          op: reduce_scatter
          group: ep
          logical_bytes:
            prefill: T*H*bytes(dtype_a)
            decode: S*H*bytes(dtype_a)
          bus_bytes:
            prefill: 'dp>1 ? (tp*dp-1)/(tp*dp)*(T*H*bytes(dtype_a)) : 0'
            decode: 'dp>1 ? (tp*dp-1)/(tp*dp)*(S*H*bytes(dtype_a)) : 0'
          when: dp>1
          notes:
            - Default allgather_reducescatter backend, flattened tp*dp group even with ep=1. Logical tensor is
              T*H; ring bus factor is (n-1)/n. Expert compute uses T*dp gathered tokens. Router
              scores/metadata omitted.
      - &id003
        suffix: reduce
        kind: comm
        comm:
          op: all_reduce
          group: tp
          logical_bytes:
            prefill: T*H*bytes(dtype_a)
            decode: S*H*bytes(dtype_a)
          bus_bytes:
            prefill: 'tp>1 || ep>1 ? (2*(tp-1)/tp)*(T*H*bytes(dtype_a)) : 0'
            decode: 'tp>1 || ep>1 ? (2*(tp-1)/tp)*(S*H*bytes(dtype_a)) : 0'
          when: tp>1 || ep>1
          notes:
            - Ring estimate; logical bytes describe the tensor even when inactive.
  - id: moe.gate
    match:
