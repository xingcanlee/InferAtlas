            prefill: T*out_features*bytes(dtype_a)
            decode: S*out_features*bytes(dtype_a)
          bus_bytes:
            prefill: 'gather_output && tp>1 ? ((tp-1)/tp)*(T*out_features*bytes(dtype_a)) : 0'
            decode: 'gather_output && tp>1 ? ((tp-1)/tp)*(S*out_features*bytes(dtype_a)) : 0'
          when: gather_output && tp>1
          notes:
            - Ring estimate; logical bytes describe the tensor even when inactive.
