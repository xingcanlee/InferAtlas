        : 0))+T*((in_features)+((num_heads/tp+2*max(1,num_kv_heads/tp))*head_size))*bytes(dtype_a)'
      decode: '((in_features*(num_heads/tp+2*max(1,num_kv_heads/tp))*head_size*bytes(dtype_w))+(has_bias ? ((num_heads/tp+2*max(1,num_kv_heads/tp))*head_size)*bytes(dtype_w)
        : 0))+S*((in_features)+((num_heads/tp+2*max(1,num_kv_heads/tp))*head_size))*bytes(dtype_a)'
    shard:
      tp: out
    emits: []
    notes:
